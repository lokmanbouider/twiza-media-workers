name: photo-embed

# Computes a CLIP ViT-B/32 image embedding (512-d) for every 'before' report
# photo missing one (photos.embedding). Feeds near-duplicate detection and
# 'similar reports' for moderation. No urgency: a missing embedding just means
# dedup falls back to the exact SHA-256 check.
#
# Real trigger: repository_dispatch (embed-photos) fired by the DB
# (pg_cron -> public.dispatch_photo_embeddings) only when a photo is actually
# waiting, so no Actions minutes are burned idle. The daily schedule is a
# backstop in case a dispatch is ever missed.

on:
  repository_dispatch:
    types: [embed-photos]
  workflow_dispatch:
  schedule:
    # backstop only — the repository_dispatch above is the real trigger
    - cron: "23 3 * * *"

concurrency:
  group: photo-embed
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: photo-embed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+ : @supabase/supabase-js exige un WebSocket natif (absent en Node 20)
          node-version: 22
          cache: npm
          cache-dependency-path: photo-embed/package-lock.json
      # onnxruntime-node télécharge à l'installation, sur Linux x64, une version
      # GPU (CUDA) hébergée sur github.com/microsoft/onnxruntime : 404 depuis le
      # 2026-11-18, npm ci échouait avant même de lire la file. Le runner n'a pas
      # de GPU et le paquet npm embarque déjà la version CPU : on saute ce
      # téléchargement, qui n'a jamais servi.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      # Poids CLIP q8 (~90 Mo) téléchargés depuis le HF Hub au 1er run puis
      # servis depuis le cache — régime permanent sans téléchargement.
      # src/embed.ts fixe env.cacheDir sous ~/.cache/huggingface : par défaut
      # Transformers.js écrit dans node_modules et ce cache n'a jamais rien
      # enregistré. Restauration et sauvegarde séparées, autour d'un `warm` qui
      # ne fait que télécharger le modèle : un simple actions/cache n'enregistre
      # qu'en fin de job réussi, et seulement si une photo a chargé le modèle
      # (file vide = rien à enregistrer).
      - name: Restore the CLIP model weights
        id: clip-weights
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: hf-Xenova-clip-vit-base-patch32-q8
      - name: Download the CLIP model weights
        if: steps.clip-weights.outputs.cache-hit != 'true'
        run: npm run warm
      - name: Save the CLIP model weights
        if: steps.clip-weights.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: hf-Xenova-clip-vit-base-patch32-q8
      - name: Drain the queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run drain
