name: share-image-backfill

# Resizes each 'before' report photo's already-uploaded full-resolution image
# down to an 880px share image (photos.share_path) — the /r/<id> and live
# /a/<id> hero image. No urgency: the page falls back to the 400px thumbnail
# until the share image exists.
#
# Real trigger: repository_dispatch (drain-share-images) fired by the DB
# (pg_cron -> public.dispatch_share_image_backfill) only when a photo is
# actually waiting, so no Actions minutes are burned idle. The daily schedule
# is a backstop in case a dispatch is ever missed.

on:
  repository_dispatch:
    types: [drain-share-images]
  workflow_dispatch:
  schedule:
    # backstop only — the repository_dispatch above is the real trigger
    - cron: "41 4 * * *"

concurrency:
  group: share-image-backfill
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: share-image-backfill
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+ : @supabase/supabase-js exige un WebSocket natif (absent en Node 20)
          node-version: 22
          cache: npm
          cache-dependency-path: share-image-backfill/package-lock.json
      - run: npm ci
      - name: Drain the queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run drain
